name: check

# The suite check is free and takes under a second, so it runs on everything.
# Model runs cost money and are never started from here.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check

      # The same suite again, measured. Kept separate from the gate above so a
      # missing coverage tool can never decide whether the suite passed.
      - name: Measure coverage
        run: |
          python3 -m pip install --disable-pip-version-check coverage==7.13.5
          make coverage ARGS=--xml=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
